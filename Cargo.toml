[package]
name = "claude-smt"
version = "0.1.0"
edition = "2021"
description = "An SMT solver supporting Boolean and bitvector theories with SMT-LIB interface"

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
python = ["pyo3"]

[lib]
name = "claude_smt"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "claude-smt"
path = "src/main.rs"

[[bench]]
name = "solver_benchmarks"
harness = false
